name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get PR info
        id: pr
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check update type
        id: check
        run: |
          TYPE="${{ steps.pr.outputs.update-type }}"
          echo "Update type: $TYPE"
          
          # Auto-merge hanya untuk patch & minor
          if [[ "$TYPE" == "version-update:semver-patch" ]] || [[ "$TYPE" == "version-update:semver-minor" ]]; then
            echo "eligible=true" >> $GITHUB_OUTPUT
            echo "✅ Eligible untuk auto-merge"
          else
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "⏭️ Major update, skip auto-merge"
          fi

      - name: Approve PR
        if: steps.check.outputs.eligible == 'true'
        run: gh pr review --approve "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.check.outputs.eligible == 'true'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.UNLYOD_TG_BOT }}
          CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          if [ "${{ steps.check.outputs.eligible }}" = "true" ]; then
            STATUS="✅ Auto-merged"
          else
            STATUS="⏭️ Skip (major update)"
          fi
          
          MSG="🤖 <b>Dependabot PR</b>
          
          <b>${{ github.event.pull_request.title }}</b>
          
          Status: $STATUS
          🔗 ${{ github.event.pull_request.html_url }}"
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ steps.check.outputs.eligible }}" = "true" ]; then
            STATUS="✅ Auto-merged"
            COLOR=5763719
          else
            STATUS="⏭️ Skip (major update)"
            COLOR=16776960
          fi
          
          curl -s -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🤖 Dependabot PR\",
                \"description\": \"${{ github.event.pull_request.title }}\",
                \"url\": \"${{ github.event.pull_request.html_url }}\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Status\", \"value\": \"$STATUS\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"unlyod[bot] · dependabot\"}
              }]
            }"