name: Notify Discord on New Blog Post

on:
  push:
    branches: ['Dev']
    paths:
      - 'src/content/docs/blog/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Extract post info
        id: post
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD | grep 'src/content/docs/blog/.*\.\(md\|mdx\)' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Tidak ada file post yang berubah."
            exit 0
          fi

          SLUG=$(basename "$FILE" | sed 's/\.[^.]*$//')
          TITLE=$(grep -m1 '^title:' "$FILE" | sed 's/title: *//; s/"//g; s/'"'"'//g')

          # Ambil cover.image — cari baris "image:" SETELAH "cover:"
          COVER=$(awk '
            /^cover:/ { in_cover=1; next }
            in_cover && /^[a-zA-Z]/ { in_cover=0 }
            in_cover && /^[[:space:]]+image:/ {
              sub(/^[[:space:]]+image:[[:space:]]*/, "")
              gsub(/["'"'"']/, "")
              print
              exit
            }
          ' "$FILE")

          # Resolve cover jadi URL absolut
          if [ -z "$COVER" ]; then
            COVER_URL=""
          elif echo "$COVER" | grep -q '^https\?://'; then
            # Remote URL → pakai langsung
            COVER_URL="$COVER"
          elif echo "$COVER" | grep -q '^/'; then
            # Absolute path dari public/ → prefix dengan domain
            COVER_URL="https://bimaakbar-dev.github.io${COVER}"
          else
            # Relative path (mis. ./cover.jpg) → resolve ke raw GitHub
            DIR=$(dirname "$FILE")
            CLEAN_PATH=$(echo "${DIR}/${COVER}" | sed 's|^\./||')
            COVER_URL="https://raw.githubusercontent.com/bimaakbar-dev/bimaakbar-dev.github.io/main/${CLEAN_PATH}"
          fi

          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "cover=$COVER_URL" >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        if: steps.post.outputs.slug != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: "${{ steps.post.outputs.title }}"
          embed-url: "https://bimaakbar-dev.github.io/blog/${{ steps.post.outputs.slug }}/"
          embed-description: "Postingan blog baru! Klik judul untuk membaca."
          embed-color: 5814783
          embed-image-url: ${{ steps.post.outputs.cover }}
          embed-footer: "bimaakbar-dev.github.io"
          username: "c0desk1 Blog"
