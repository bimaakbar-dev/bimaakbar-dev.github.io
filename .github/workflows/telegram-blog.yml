name: RSS to Telegram

on:
  workflow_run:
    workflows: ["Deploy Astro site to Pages"]
    types: [completed]
    branches: [Dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-telegram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telegram:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: Dev

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install feedparser
        run: pip install feedparser requests

      - name: Fetch RSS & Post to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import feedparser, requests, os, json, pathlib

          RSS_URL = "https://bimaakbar-dev.github.io/rss.xml"
          SITE = "https://bimaakbar-dev.github.io"
          STATE = pathlib.Path(".telegram-state.json")

          posted = []
          if STATE.exists():
              try:
                  posted = json.loads(STATE.read_text()).get("posted", [])
              except Exception:
                  posted = []

          feed = feedparser.parse(RSS_URL)
          if not feed.entries:
              print("No entries found")
              exit(0)

          token = os.environ["TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          new_count = 0

          for entry in feed.entries:
              link = entry.link
              if link.startswith("/"):
                  link = SITE + link

              if link in posted:
                  continue

              message = (
                  f"<b>c0desk1 Blog</b>\n\n"
                  f"<b>{entry.title}</b>\n\n"
                  f"{entry.get('description', '')[:250]}\n\n"
                  f'<a href="{link}">Baca selengkapnya ↗</a>'
              )

              resp = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": message,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": False,
                  },
              )
              print(f"Posted: {entry.title} → Status: {resp.status_code}")

              if resp.status_code == 200:
                  posted.append(link)
                  new_count += 1

          if new_count == 0:
              print("No new post")
              exit(0)

          posted = posted[-100:]
          STATE.write_text(json.dumps({"posted": posted}, indent=2))
          print(f"Total new posts: {new_count}")
          EOF

      - name: Commit state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f .telegram-state.json ]; then
            git add .telegram-state.json
            git diff --staged --quiet || git commit -m "Update Telegram state [skip ci]"
            git push origin Dev
          fi
